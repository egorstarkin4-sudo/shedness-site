<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Shedness Launcher — Сброс пароля</title>
  <link rel="icon" type="image/png" href="./assets/img/logo.png" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="shader-fallback-bg" aria-hidden="true"></div>
  <canvas id="bg-shader-canvas" aria-hidden="true"></canvas>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <div class="site-content">
    <main class="container" style="flex: 1; padding: 80px 20px; max-width: 460px;">
      <div class="glass-card">
        <h1 style="font-size: 22px; margin-bottom: 12px;">Восстановление пароля</h1>
        <div id="reset-alert" class="alert-banner hidden"></div>

        <form id="reset-request-form" style="display: flex; flex-direction: column; gap: 14px;">
          <input id="reset-email" type="email" class="input-field" placeholder="Ваш email" required />
          <div id="reset-turnstile"></div>
          <button type="submit" class="btn-primary">Отправить ссылку</button>
        </form>

        <form id="reset-update-form" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
          <input id="new-password" type="password" class="input-field" placeholder="Новый пароль (от 8 символов)" required />
          <button type="submit" class="btn-primary">Сохранить новый пароль</button>
        </form>

        <div style="margin-top: 16px;">
          <a href="./profile.html" style="font-size: 13px; color: var(--text-secondary);">← Вернуться в кабинет</a>
        </div>
      </div>
    </main>
  </div>

  <script src="./assets/js/site-config.js?v=3"></script>
  <script src="./assets/js/anime.min.js"></script>
  <script src="./assets/js/effects.js?v=3"></script>
  <script src="./assets/js/animations.js"></script>
  <script src="./assets/js/reset.js?v=3"></script>
</body>
</html>
